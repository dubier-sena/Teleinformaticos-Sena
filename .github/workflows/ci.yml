name: CI

# Fase 15: valida el portal antes de publicarlo, y solo publica si las 4
# validaciones pasan. GitHub Pages de este repo publicaba en modo "legacy"
# (deploy automatico desde la rama `main`, sin pasar por este workflow);
# desde que se agrego el job "deploy" de abajo, Pages quedo migrado a modo
# Actions y el flujo real es: push a main -> test + secrets-scan +
# smoke-test + windows-build-check en paralelo -> si los 4 pasan, "deploy"
# (que depende de los 4 via needs) publica el sitio. Si cualquiera falla, no
# se publica nada. La ruta de migracion completa (por que, como se decidio
# el contenido del artifact) vive en el README y en las notas de la sesion
# que agrego este workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llegan varios push seguidos a la misma rama/PR, cancela la corrida
# anterior en vez de dejarla terminar -- ahorra minutos de CI sin perder
# cobertura (el ultimo commit es el que importa). El job "deploy" NO usa
# este grupo: tiene su propia concurrencia mas abajo, pensada para publicar
# (nunca cancelar una publicacion a medias).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permiso por defecto para todos los jobs: solo lectura del repo. El job
# "deploy" es el unico que necesita mas (pages, id-token) y lo declara el
# mismo, explicitamente, mas abajo.
permissions:
  contents: read

jobs:
  # Suite completa de Node (1075+ pruebas: CSP, identidad/UID, Apps Script,
  # Firestore Rules, router, guardias de acceso, resumen del aprendiz,
  # concurrencia, registro, privacidad -- todas ya viven en tests/*.test.cjs,
  # este job no reconstruye nada, solo las ejecuta todas).
  test:
    name: Suite Node (tests/*.test.cjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Sin cache: npm -- el proyecto no tiene package.json/package-lock.json
          # (sin build system, sin dependencias de npm; ver CLAUDE.md).

      - name: node --test tests/*.test.cjs
        run: node --test tests/*.test.cjs

  # Escaneo generico de secretos (gitleaks) sobre el arbol actual del
  # checkout -- complementa (no reemplaza) tests/no_committed_secrets.test.cjs:
  # gitleaks trae un set de reglas amplio (claves privadas, tokens de
  # proveedores conocidos AWS/GCP/etc., credenciales genericas) mantenido por
  # terceros; el test propio de la suite cubre ademas los nombres EXACTOS de
  # este proyecto (REGISTRATION_CODE_SECRET, contraseñas en texto plano) con
  # los que gitleaks no puede estar familiarizado. Sin instalar nada via npm:
  # se descarga el binario oficial (Go, un solo archivo) y se corre directo.
  # .gitleaks.toml documenta la unica excepcion deliberada (la apiKey publica
  # de Firebase).
  secrets-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: gitleaks detect (arbol actual, sin historial de git)
        run: ./gitleaks detect --source . --no-git --redact -v

  # Smoke test de navegador headless: abre paginas reales (invitado, admin,
  # auxiliar autenticada, guia.html) y falla si aparece un ReferenceError/
  # TypeError, un script 404, o un error de orden de carga -- exactamente lo
  # que la suite de Node NO puede ver (la Fase 14 encontro asi un bug real).
  # Corre en paralelo al job "test", no depende de el (ninguno de los dos
  # necesita el resultado del otro para arrancar).
  smoke-test:
    name: Smoke test (navegador headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node tools/smoke_test.mjs
        run: node tools/smoke_test.mjs

  # sources/generated/*.template.html + data/generated_page_variants.json ->
  # tools/build-generated-pages.ps1 -> paginas HTML publicas reales (p.ej.
  # pages/auxiliares/grupo-10a-guia-02-actividad-322-matriz.html). El script
  # asume rutas de Windows (Join-Path con "\"), asi que corre en un runner
  # windows-latest de verdad, no con pwsh instalado sobre Ubuntu.
  #
  # git diff --exit-code detecta el caso que esta fase queria evitar:
  # plantilla actualizada pero el HTML publico generado NO se volvio a
  # generar/commitear.
  windows-build-check:
    name: Build de paginas generadas (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Solo el test del catalogo + build de plantillas (no toda la suite)
        run: node --test tests/generated_pages_build.test.cjs

      - name: Reconstruir las paginas generadas en el propio checkout
        shell: pwsh
        run: ./tools/build-generated-pages.ps1

      - name: git diff --exit-code (falla si el build generado difiere de lo commiteado)
        shell: pwsh
        run: |
          # Solo pages/ es salida del build (sources/generated/*.template.html
          # es la entrada -- plantillas que el script LEE, nunca escribe).
          git diff --exit-code -- pages/
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Las paginas generadas no coinciden con las plantillas actuales. Corre tools/build-generated-pages.ps1 y commitea el resultado."
            exit 1
          }

  # Publica en GitHub Pages -- SOLO si test + secrets-scan + smoke-test +
  # windows-build-check pasaron los 4 (needs) y SOLO en un push directo a
  # main (nunca en un pull_request, ni siquiera si viene de main). Si algo
  # de arriba falla o se cancela, GitHub Actions no ejecuta este job: no se
  # publica nada.
  #
  # No hay build nuevo aqui: Pages en modo "legacy" (el que tenia este repo
  # antes de este job) publicaba la RAIZ del repo tal cual, via el Jekyll
  # por defecto de Pages, que ya excluye cualquier archivo/carpeta que
  # empiece con "." (.git, .github, .gitignore, .gitleaks.toml, etc.) --
  # confirmado probando el sitio publicado hoy antes de escribir este job.
  # El paso de abajo replica exactamente ese mismo recorte con rsync, para
  # publicar el mismo contenido que ya se publicaba (ni mas, ni menos), en
  # vez de inventar un build nuevo.
  #
  # Apps Script (apps-script/*.gs) y Firestore Rules (firestore.rules)
  # siguen FUERA de este workflow: esto solo publica paginas estaticas para
  # GitHub Pages, nunca despliega Apps Script ni reglas de Firestore.
  deploy:
    name: Deploy a GitHub Pages
    needs: [test, secrets-scan, smoke-test, windows-build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Concurrencia propia (no la de arriba): un despliegue en curso NUNCA se
    # cancela por un push nuevo, se encola. Es el patron que recomienda la
    # documentacion oficial de GitHub Pages para el job de deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el contenido a publicar (mismo recorte que el Pages legacy actual)
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/pages-site"
          mkdir -p "$SITE_DIR"
          rsync -a --exclude='.*' ./ "$SITE_DIR/"
          echo "--- contenido preparado para Pages ---"
          du -sh "$SITE_DIR"
          test -f "$SITE_DIR/index.html" || { echo "::error::index.html no quedo en el artifact"; exit 1; }
          test ! -e "$SITE_DIR/.git" || { echo "::error::.git quedo incluido en el artifact"; exit 1; }

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
